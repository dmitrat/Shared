name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-changes:
    name: Discover Changed Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          list-files: json
          filters: |
            OutWit.Shared.Email.Providers:
              - 'Email/OutWit.Shared.Email.Providers/**'
            OutWit.Shared.Email.Provider.Null:
              - 'Email/OutWit.Shared.Email.Provider.Null/**'
              - 'Email/OutWit.Shared.Email.Provider.Null.Tests/**'
              - 'Email/OutWit.Shared.Email.Providers/**'
            OutWit.Shared.Email.Provider.Smtp:
              - 'Email/OutWit.Shared.Email.Provider.Smtp/**'
              - 'Email/OutWit.Shared.Email.Provider.Smtp.Tests/**'
              - 'Email/OutWit.Shared.Email.Providers/**'
            OutWit.Shared.Email.Provider.Resend:
              - 'Email/OutWit.Shared.Email.Provider.Resend/**'
              - 'Email/OutWit.Shared.Email.Provider.Resend.Tests/**'
              - 'Email/OutWit.Shared.Email.Providers/**'
            OutWit.Shared.Messenger.Providers:
              - 'Messenger/OutWit.Shared.Messenger.Providers/**'
            OutWit.Shared.Messenger.Provider.Null:
              - 'Messenger/OutWit.Shared.Messenger.Provider.Null/**'
              - 'Messenger/OutWit.Shared.Messenger.Provider.Null.Tests/**'
              - 'Messenger/OutWit.Shared.Messenger.Providers/**'
            OutWit.Shared.Messenger.Provider.Telegram:
              - 'Messenger/OutWit.Shared.Messenger.Provider.Telegram/**'
              - 'Messenger/OutWit.Shared.Messenger.Provider.Telegram.Tests/**'
              - 'Messenger/OutWit.Shared.Messenger.Providers/**'
            OutWit.Shared.Logging.Blazor:
              - 'Logging/OutWit.Shared.Logging.Blazor/**'
            OutWit.Shared.Logging.Providers:
              - 'Logging/OutWit.Shared.Logging.Providers/**'
            OutWit.Shared.Logging.Provider.File:
              - 'Logging/OutWit.Shared.Logging.Provider.File/**'
              - 'Logging/OutWit.Shared.Logging.Provider.File.Tests/**'
              - 'Logging/OutWit.Shared.Logging.Providers/**'
            OutWit.Shared.Logging.Provider.NewRelic:
              - 'Logging/OutWit.Shared.Logging.Provider.NewRelic/**'
              - 'Logging/OutWit.Shared.Logging.Provider.NewRelic.Tests/**'
              - 'Logging/OutWit.Shared.Logging.Providers/**'
            OutWit.Shared.Logging.Provider.Loki:
              - 'Logging/OutWit.Shared.Logging.Provider.Loki/**'
              - 'Logging/OutWit.Shared.Logging.Provider.Loki.Tests/**'
              - 'Logging/OutWit.Shared.Logging.Providers/**'
            OutWit.Shared.Storage.Providers:
              - 'Storage/OutWit.Shared.Storage.Providers/**'
            OutWit.Shared.Storage.Provider.Disk:
              - 'Storage/OutWit.Shared.Storage.Provider.Disk/**'
              - 'Storage/OutWit.Shared.Storage.Provider.Disk.Tests/**'
              - 'Storage/OutWit.Shared.Storage.Providers/**'
            OutWit.Shared.Secrets.Providers:
              - 'Secrets/OutWit.Shared.Secrets.Providers/**'
              - 'Secrets/OutWit.Shared.Secrets.Providers.Tests/**'
              - 'Secrets/OutWit.Shared.Secrets.Conformance/**'
            OutWit.Shared.Secrets.Provider.Windows:
              - 'Secrets/OutWit.Shared.Secrets.Provider.Windows/**'
              - 'Secrets/OutWit.Shared.Secrets.Provider.Windows.Tests/**'
              - 'Secrets/OutWit.Shared.Secrets.Providers/**'
              - 'Secrets/OutWit.Shared.Secrets.Conformance/**'
            OutWit.Shared.Secrets.Provider.File:
              - 'Secrets/OutWit.Shared.Secrets.Provider.File/**'
              - 'Secrets/OutWit.Shared.Secrets.Provider.File.Tests/**'
              - 'Secrets/OutWit.Shared.Secrets.Providers/**'
              - 'Secrets/OutWit.Shared.Secrets.Conformance/**'
            OutWit.Shared.Secrets.Provider.Linux:
              - 'Secrets/OutWit.Shared.Secrets.Provider.Linux/**'
              - 'Secrets/OutWit.Shared.Secrets.Provider.Linux.Tests/**'
              - 'Secrets/OutWit.Shared.Secrets.Providers/**'
              - 'Secrets/OutWit.Shared.Secrets.Conformance/**'
              - '.github/workflows/ci.yml'
            OutWit.Shared.Secrets.Provider.MacOS:
              - 'Secrets/OutWit.Shared.Secrets.Provider.MacOS/**'
              - 'Secrets/OutWit.Shared.Secrets.Provider.MacOS.Tests/**'
              - 'Secrets/OutWit.Shared.Secrets.Providers/**'
              - 'Secrets/OutWit.Shared.Secrets.Conformance/**'
              - '.github/workflows/ci.yml'
            OutWit.Shared.Secrets.Settings:
              - 'Secrets/OutWit.Shared.Secrets.Settings/**'
              - 'Secrets/OutWit.Shared.Secrets.Settings.Tests/**'
              - 'Secrets/OutWit.Shared.Secrets.Providers/**'
            OutWit.Shared.Secrets.Desktop:
              - 'Secrets/**'

  run-tests:
    name: Test ${{ matrix.project }}
    needs: discover-changes
    if: needs.discover-changes.outputs.projects != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-changes.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET SDKs (6/7/8/9/10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
            
      - name: Restore
        run: dotnet restore OutWit.slnx

      - name: Resolve test project path
        id: paths
        shell: pwsh
        run: |
          $projName = '${{ matrix.project }}'
          $test = Get-ChildItem -Recurse -Filter "$projName.Tests.csproj" | Select-Object -Expand FullName -First 1
          if (!$test) {
            Write-Host "No test project for $projName � skipping tests."
            "hasTests=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "hasTests=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "testCsproj=$test" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Run tests
        if: steps.paths.outputs.hasTests == 'true'
        run: dotnet test "${{ steps.paths.outputs.testCsproj }}" --configuration Release --no-restore

  # The Secrets Linux provider talks to the Secret Service, which is a session
  # service: the hosted agent gets a D-Bus session and an unlocked gnome-keyring
  # for the duration of the test run, or the conformance rows would honestly
  # answer Unavailable and fail.
  test-secrets-linux:
    name: Test OutWit.Shared.Secrets.Provider.Linux (unlocked keyring)
    needs: discover-changes
    if: contains(needs.discover-changes.outputs.projects, 'OutWit.Shared.Secrets.Provider.Linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install keyring
        run: sudo apt-get update && sudo apt-get install -y dbus libsecret-1-0 gnome-keyring

      - name: Restore
        run: dotnet restore Secrets/OutWit.Shared.Secrets.Provider.Linux.Tests/OutWit.Shared.Secrets.Provider.Linux.Tests.csproj

      - name: Test under an unlocked keyring
        # The password must be non-empty and newline-terminated: --unlock creates the
        # login collection when it does not exist, but silently does not with an empty
        # password — the daemon then answers and the default alias points at nothing.
        run: |
          dbus-run-session -- bash -c '
            eval "$(printf "ci-keyring\n" | gnome-keyring-daemon --unlock --replace --components=secrets)"
            dotnet test Secrets/OutWit.Shared.Secrets.Provider.Linux.Tests/OutWit.Shared.Secrets.Provider.Linux.Tests.csproj --configuration Release --no-restore
          '

  # The Secrets macOS provider uses the default keychain; the job creates an
  # unlocked one with no auto-lock so nothing prompts on a headless agent.
  test-secrets-macos:
    name: Test OutWit.Shared.Secrets.Provider.MacOS (keychain)
    needs: discover-changes
    if: contains(needs.discover-changes.outputs.projects, 'OutWit.Shared.Secrets.Provider.MacOS')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create an unlocked default keychain
        run: |
          security create-keychain -p ci ci.keychain-db
          security default-keychain -s ci.keychain-db
          security unlock-keychain -p ci ci.keychain-db
          security set-keychain-settings ci.keychain-db

      - name: Restore
        run: dotnet restore Secrets/OutWit.Shared.Secrets.Provider.MacOS.Tests/OutWit.Shared.Secrets.Provider.MacOS.Tests.csproj

      - name: Run tests
        run: dotnet test Secrets/OutWit.Shared.Secrets.Provider.MacOS.Tests/OutWit.Shared.Secrets.Provider.MacOS.Tests.csproj --configuration Release --no-restore
